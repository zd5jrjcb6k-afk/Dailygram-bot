<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savana Kingdom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    /* Savanne Speelveld met Achtergrond */
    .game-viewport {
      position: relative;
      width: 100%;
      height: 280px;
      background: url('https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 -40px 50px rgba(0,0,0,0.6);
    }

    /* Schuilplaats Badge */
    .shelter-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 215, 0, 0.3);
    }

    /* Geanimeerde Baby Welp */
    .lion-cub {
      position: absolute;
      bottom: 20px;
      left: 10%;
      width: 90px;
      height: 90px;
      background-image: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHJ4Z2Z3ZnN3Z2R3Z2R3Z2R3Z2R3Z2R3Z2R3Z2R3/3o7TKMt1VVNkHV2PaE/giphy.gif'); /* Vervang door jouw welp GIF/afbeelding */
      background-size: contain;
      background-repeat: no-repeat;
      animation: walkAround 12s infinite alternate ease-in-out;
      filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
    }

    /* Welp Wandel Animatie */
    @keyframes walkAround {
      0% { transform: translateX(0px) scaleX(1); }
      45% { transform: translateX(200px) scaleX(1); }
      50% { transform: translateX(200px) scaleX(-1); } /* Draai om */
      95% { transform: translateX(10px) scaleX(-1); }
      100% { transform: translateX(10px) scaleX(1); }
    }

    /* Statistieken & Bakiye Panel */
    .dashboard {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .balance-card {
      background: #241b14;
      border: 1px solid #3d2c1e;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .balance-title {
      color: #a08a75;
      font-size: 0.85rem;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .balance-amount {
      font-size: 2.2rem;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 15px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat-box {
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      color: #ccc;
    }

    .stat-value {
      font-weight: bold;
      color: #fff;
      margin-top: 4px;
    }

    .btn-claim {
      width: 100%;
      background: linear-gradient(135deg, #ffb700, #ff8800);
      border: none;
      padding: 16px;
      border-radius: 12px;
      color: #000;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 136, 0, 0.4);
      transition: transform 0.1s;
    }

    .btn-claim:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Savanne Speelveld -->
    <div class="game-viewport">
      <div class="shelter-badge">🏡 Schuilplaats: Houten Hut (Lvl 1)</div>
      <!-- De lophouding / eten van de welp -->
      <div class="lion-cub" id="lionCub"></div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard">
      <div class="balance-card">
        <div class="balance-title">SAVANA SALDO</div>
        <div class="balance-amount" id="balance">0.0000</div>

        <div class="stats-grid">
          <div class="stat-box">
            <div>Snelheid / dag</div>
            <div class="stat-value" id="rate">0.5000 / dag</div>
          </div>
          <div class="stat-box">
            <div>Te verzamelen</div>
            <div class="stat-value" id="unclaimed">0.0000</div>
          </div>
        </div>

        <button class="btn-claim" onclick="claimEarnings()">⚡ OPBRENGST VERZAMELEN</button>
      </div>
    </div>
  </div>

</body>
</html>
