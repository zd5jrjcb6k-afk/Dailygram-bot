<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lion Miner Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --text-color: #f8fafc;
      --text-secondary: #94a3b8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      padding: 10px 0;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      color: var(--accent-color);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .balance-title {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .balance-amount {
      font-size: 32px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
    }

    .btn {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .status-msg {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🦁 Lion Miner</h1>
      <p id="user-display" style="margin: 4px 0 0 0; color: var(--text-secondary); font-size: 14px;">Laden...</p>
    </div>

    <div class="card">
      <div class="balance-title">Mijn Saldo</div>
      <div class="balance-amount" id="balance">0.0000</div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="balance-title">Dagelijkse Rate</div>
        <div class="stat-value" id="daily-rate">0.5000</div>
      </div>
      <div class="stat-card">
        <div class="balance-title">Level</div>
        <div class="stat-value" id="level">1</div>
      </div>
    </div>

    <button class="btn" onclick="claimYield()">Claim Yield ⚡</button>
    <div class="status-msg" id="status-msg">Verbinden met database...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const API_BASE = "https://dailygram-bot.onrender.com";
    let telegramId = tg.initDataUnsafe?.user?.id || 12345678;
    let username = tg.initDataUnsafe?.user?.username || "Gast";
    let firstName = tg.initDataUnsafe?.user?.first_name || "Lion";

    async function initUser() {
      document.getElementById("user-display").innerText = `Speler: ${firstName}`;
      
      try {
        const response = await fetch(`${API_BASE}/api/user`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            telegram_id: telegramId,
            username: username,
            first_name: firstName
          })
        });

        const data = await response.json();
        if (data.status === "success") {
          document.getElementById("balance").innerText = parseFloat(data.player.balance).toFixed(4);
          document.getElementById("daily-rate").innerText = parseFloat(data.player.daily_rate).toFixed(4);
          document.getElementById("level").innerText = data.player.level;
          document.getElementById("status-msg").innerText = "Gekoppeld aan Supabase ✅";
        }
      } catch (err) {
        document.getElementById("status-msg").innerText = "Fout bij laden van gegevens.";
        console.error(err);
      }
    }

    async function claimYield() {
      document.getElementById("status-msg").innerText = "Claimen...";
      try {
        const response = await fetch(`${API_BASE}/api/claim`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            telegram_id: telegramId,
            amount: 0.1
          })
        });

        const data = await response.json();
        if (data.status === "success") {
          document.getElementById("balance").innerText = parseFloat(data.new_balance).toFixed(4);
          document.getElementById("status-msg").innerText = "Succesvol opgehaald! 🎉";
        }
      } catch (err) {
        document.getElementById("status-msg").innerText = "Claimen mislukt.";
        console.error(err);
      }
    }

    initUser();
  </script>
</body>
</html>
