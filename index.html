<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dailygram Miner Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --gold-color: #fbbf24;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            user-select: none;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .user-info {
            font-weight: bold;
            font-size: 16px;
        }

        .status-badge {
            background: #22c55e;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .miner-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.15);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .miner-icon {
            font-size: 80px;
            margin: 15px 0;
            animation: pulse 2s infinite ease-in-out;
            cursor: pointer;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .balance-label {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 800;
            color: var(--gold-color);
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        .progress-container {
            background: #334155;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            height: 100%;
            width: 65%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            text-align: left;
        }

        .stat-box .title {
            font-size: 12px;
            color: #94a3b8;
        }

        .stat-box .value {
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
            color: #f1f5f9;
        }

        .action-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="user-info" id="userName">Miner</div>
            <div class="status-badge" id="statusBadge">Active 🟢</div>
        </div>

        <!-- MAIN MINER CARD -->
        <div class="miner-card">
            <div class="balance-label">Total Balance</div>
            <div class="balance-amount" id="balanceText">100.000 GRAM</div>
            
            <div class="miner-icon" id="gemIcon">💎</div>

            <div class="balance-label">Daily Mining Progress</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div style="font-size: 12px; color: #94a3b8;" id="progressText">Mining at 0.5% daily rate</div>
        </div>

        <!-- STATS GRID -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="title">Active Deposit</div>
                <div class="value" id="activeDeposit">100 GRAM</div>
            </div>
            <div class="stat-box">
                <div class="title">Daily Yield</div>
                <div class="value" id="dailyYield">+0.500 GRAM</div>
            </div>
        </div>

        <!-- ACTION BUTTON -->
        <button class="action-btn" onclick="claimReward()">⚡ Claim Mining Yield</button>
    </div>

    <script>
        // Init Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Open fullscreen

        // Fetch user data from Telegram context
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Live balance simulation counter
        let currentBalance = 100.0000;
        setInterval(() => {
            currentBalance += 0.00001;
            document.getElementById('balanceText').innerText = currentBalance.toFixed(4) + " GRAM";
        }, 1000);

        function claimReward() {
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('🎉 Daily yield successfully synced with your balance!');
        }
    </script>
</body>
</html>
