<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dailygram Miner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b1a28;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: linear-gradient(180deg, #1d5276 0%, #0d2334 100%);
      display: flex;
      flex-direction: column;
      padding: 12px;
      padding-bottom: 90px;
    }

    /* Savanne Speelveld Card */
    .game-card {
      position: relative;
      width: 100%;
      height: 250px;
      background: url('https://images.unsplash.com/photo-1516426122078-c23e76319801?auto=format&fit=crop&w=800&q=80') center/cover no-repeat;
      border: 3px solid #ff9900;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      margin-bottom: 15px;
    }

    /* Yuva / Shelter Badge */
    .shelter-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #fff;
    }

    /* Leeuwenkop / Welp op het speelveld */
    .lion-cub {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 60px;
      height: 60px;
      font-size: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.6));
      animation: bounce 2s infinite ease-in-out;
      cursor: pointer;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* Bakiye Card */
    .balance-card {
      background: rgba(28, 18, 10, 0.85);
      border: 2px solid #5a3d24;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .balance-title {
      color: #bfa38a;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .balance-amount {
      font-size: 2.4rem;
      font-weight: 800;
      color: #ffd700;
      margin-bottom: 15px;
      text-shadow: 0 2px 10px rgba(255,215,0,0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.35);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .stat-label {
      color: #aaa;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .stat-value {
      font-weight: bold;
      color: #fff;
      font-size: 0.95rem;
    }

    /* Kazancı Topla Buton */
    .btn-claim {
      width: 100%;
      background: linear-gradient(135deg, #ffb700, #ff8800);
      border: none;
      padding: 16px;
      border-radius: 14px;
      color: #000;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(255, 136, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-claim:active {
      transform: scale(0.98);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: #180f08;
      border-top: 2px solid #3d2716;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 15px 0;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8a7a6e;
      font-size: 0.75rem;
      text-decoration: none;
      cursor: pointer;
      gap: 4px;
    }

    .nav-item.active {
      color: #ffd700;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 1.4rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Savanne Speelveld -->
    <div class="game-card">
      <div class="shelter-badge">🏡 Yuva: Ahşap Barınak</div>
      <!-- Leeuwenkopje -->
      <div class="lion-cub" id="lionCub">🦁</div>
    </div>

    <!-- Bakiye Panel -->
    <div class="balance-card">
      <div class="balance-title">GRAM BAKIYEM</div>
      <div class="balance-amount" id="balance">0.0000</div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Günlük Hız</div>
          <div class="stat-value" id="rate">0.0001 / gün</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Toplanacak</div>
          <div class="stat-value" id="unclaimed">0.0000</div>
        </div>
      </div>

      <button class="btn-claim" onclick="claimEarnings()">⚡ KAZANCI TOPLA</button>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🦁</div>
      <div>Yavru</div>
    </div>
    <div class="nav-item" onclick="alert('Market pek yakında!')">
      <div class="nav-icon">🛒</div>
      <div>Market</div>
    </div>
    <div class="nav-item" onclick="alert('Görevler pek yakında!')">
      <div class="nav-icon">📋</div>
      <div>Görevler</div>
    </div>
    <div class="nav-item" onclick="alert('Arkadaşlarınızı davet edin!')">
      <div class="nav-icon">👥</div>
      <div>Arkadaşlar</div>
    </div>
    <div class="nav-item" onclick="alert('Cüzdan bağlama çok yakında!')">
      <div class="nav-icon">👛</div>
      <div>Cüzdan</div>
    </div>
  </div>

  <script>
    function claimEarnings() {
      alert("Kazanç başarıyla toplandı!");
    }
  </script>
</body>
</html>
