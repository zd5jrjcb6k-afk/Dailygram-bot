<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Savannah Wild</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Telefoon scherm container in exacte stijl van de game */
        .phone-frame {
            width: 100%; max-width: 410px; height: 100vh; max-height: 850px;
            background: linear-gradient(180deg, #7ad2f6 0%, #a4e3b5 35%, #d1bc88 100%);
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 6px solid #1e293b;
            border-radius: 36px;
        }

        /* Stijl voor de game knoppen zoals op de screenshot */
        .game-btn {
            background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
            border: 3px solid #e0f2fe;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .game-btn:active { transform: scale(0.95); }

        .game-btn-red {
            background: linear-gradient(180deg, #f87171 0%, #dc2626 100%);
            border: 3px solid #fee2e2;
        }

        .game-btn-orange {
            background: linear-gradient(180deg, #fbbf24 0%, #d97706 100%);
            border: 3px solid #fef3c7;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        
        <!-- ================= BOVENSTE BALK (HEADER) ================= -->
        <div class="pt-3 px-3 flex justify-between items-start z-20">
            
            <!-- Profiel & Level (Links) -->
            <div class="flex items-center gap-2 bg-black/40 backdrop-blur-md p-1.5 rounded-2xl pr-3 text-white border border-amber-400/50 shadow-lg cursor-pointer" onclick="toonMelding('Profiel geopend')">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-amber-600 flex items-center justify-center font-bold border-2 border-amber-300 text-base shadow overflow-hidden">
                        👩🏽‍🦰
                    </div>
                    <div class="absolute -bottom-1 -right-1 bg-emerald-600 text-white text-[9px] font-black px-1 rounded-full border border-white">
                        14
                    </div>
                </div>
                <div class="flex flex-col">
                    <div class="text-[11px] font-black text-amber-300 leading-tight">Level 14</div>
                    <div class="text-xs font-bold text-white leading-tight">SafariAnne</div>
                    <!-- XP Progress Bar -->
                    <div class="w-20 bg-black/60 h-2 rounded-full overflow-hidden border border-amber-400/40 mt-1">
                        <div class="bg-gradient-to-r from-amber-400 to-emerald-400 h-full w-[70%]"></div>
                    </div>
                    <span class="text-[8px] text-gray-200">3450/5000 XP</span>
                </div>
            </div>

            <!-- Titel: SAVANNAH WILD (Midden) -->
            <div class="text-center font-black text-amber-300 text-lg tracking-wider italic drop-shadow-[0_3px_3px_rgba(0,0,0,0.9)]" style="text-shadow: 2px 2px 0px #78350f, -1px -1px 0px #f59e0b;">
                SAVANNAH<br>WILD
            </div>

            <!-- Valuta & Goals (Rechts) -->
            <div class="flex flex-col gap-1 items-end">
                <div class="bg-black/50 backdrop-blur-md px-3 py-1 rounded-full text-white text-xs font-black flex items-center gap-1.5 border border-amber-400/60 shadow">
                    <span>124.5K</span> <span class="text-amber-400 text-sm">🪙</span>
                </div>
                <div class="bg-black/50 backdrop-blur-md px-3 py-1 rounded-full text-white text-xs font-black flex items-center gap-1.5 border border-cyan-400/60 shadow">
                    <span>78</span> <span class="text-cyan-400 text-sm">💎</span>
                </div>
            </div>
        </div>

        <!-- Kleine knopjes linksonder profiel (Quests / Ships zoals in screenshot) -->
        <div class="absolute top-20 left-3 flex gap-2 z-20">
            <button onclick="toonMelding('Quests openen')" class="bg-sky-500 border-2 border-white rounded-xl p-1.5 shadow-md flex items-center gap-1 text-[10px] font-bold text-white">
                <span>📋</span> Quests
            </button>
            <button onclick="toonMelding('Shop openen')" class="bg-amber-500 border-2 border-white rounded-xl p-1.5 shadow-md flex items-center gap-1 text-[10px] font-bold text-white">
                <span>📦</span> Shop
            </button>
        </div>

        <!-- ================= HABITAT STATUS & DAILY GOALS (RECHTSBOVEN) ================= -->
        <div class="absolute top-16 right-3 bg-emerald-950/90 backdrop-blur-md border-2 border-emerald-500/70 rounded-2xl p-2.5 text-white text-[10px] shadow-2xl z-20 w-48">
            <div class="flex justify-between">🌿 Habitat Health: <span class="text-emerald-300 font-black">98%</span></div>
            <div class="flex justify-between">❤️ Animal Happiness: <span class="text-emerald-300 font-black">95%</span></div>
            <div class="mt-1.5 pt-1.5 border-t border-emerald-500/40 font-black text-amber-300 flex items-center gap-1">
                <span>⚠️</span> DAILY GOALS
            </div>
            <div class="text-[9px] text-gray-200 mt-0.5">1. Feed Giraffes (0/5)</div>
            <div class="text-[9px] text-gray-200">2. Place Acacia Tree (0/1)</div>
            <div class="text-[9px] text-gray-200">3. Expand Habitat!</div>
        </div>

        <!-- ================= MIDDEN: SAVANNA WERELD (VISUELE LAYOUT) ================= -->
        <div class="absolute inset-0 flex items-center justify-center overflow-hidden z-10 pointer-events-none">
            <div class="relative w-full h-full">
                
                <!-- Hoofdgebouw Toren (Midden) -->
                <div class="absolute top-40 left-1/2 -translate-x-1/2 bg-amber-900/90 border-2 border-amber-500 rounded-xl px-3 py-1.5 text-white text-center shadow-xl pointer-events-auto cursor-pointer" onclick="toonMelding('Toren - Level 8')">
                    <span class="text-lg">🏡</span>
                    <span class="text-[10px] block font-black text-amber-300">Level 8 Toren</span>
                </div>

                <!-- Giraffen (Links) -->
                <div class="absolute top-48 left-12 text-3xl pointer-events-auto cursor-pointer hover:scale-110 transition" onclick="toonMelding('Giraffen Leefgebied')">
                    🦒🦒
                </div>

                <!-- Leeuwenrots (Rechtsmidden) -->
                <div class="absolute top-56 right-8 bg-amber-950/80 border border-amber-500 rounded-xl px-2 py-1 text-center shadow-lg pointer-events-auto cursor-pointer" onclick="toonMelding('Leeuwenrots')">
                    🦁🦁 <span class="text-[9px] block text-amber-300 font-bold">Koning Leeuw</span>
                </div>

                <!-- Waterpoel (Linksonder in het midden) -->
                <div class="absolute top-72 left-6 w-52 h-32 bg-sky-400/80 rounded-full border-4 border-sky-600/70 shadow-inner flex items-center justify-center text-2xl pointer-events-auto cursor-pointer" onclick="toonMelding('Waterpoel Oase')" style="transform: rotate(-10deg);">
                    💧🦓🦏
                </div>

                <!-- Hoofdleefgebied banner onderin -->
                <div class="absolute bottom-40 left-8 right-8 py-2 px-4 bg-amber-200/90 border-2 border-amber-600 rounded-2xl shadow-xl text-center pointer-events-auto cursor-pointer" onclick="toonMelding('Beheer Hoofdleefgebied')">
                    <span class="text-xs font-black text-amber-950">✨ Hoofdleefgebied (Tik om te beheren) ✨</span>
                </div>

            </div>
        </div>

        <!-- ================= ONDERSTE KNOPPEN LAYOUT (EXACT ZOALS SCREENSHOT) ================= -->
        <div class="p-3 pb-5 flex flex-col justify-end z-20 bg-gradient-to-t from-black/70 via-black/30 to-transparent">
            
            <!-- Grote BUILD Knop in het midden -->
            <div class="flex justify-center mb-3">
                <button onclick="toonMelding('🏗️ Bouwmenu geopend!')" class="bg-gradient-to-r from-sky-400 via-sky-500 to-sky-600 text-white font-black text-xl px-16 py-3 rounded-2xl shadow-[0_8px_25px_rgba(14,165,233,0.6)] border-4 border-white active:scale-95 transition cursor-pointer tracking-widest uppercase">
                    BUILD
                </button>
            </div>

            <!-- Onderste Knoppenraster (3 links, 2 rechts of verdeeld zoals op foto) -->
            <div class="grid grid-cols-5 gap-2">
                <!-- Linksomgeving: Quests, Storage, Shop/Build -->
                <button onclick="toonMelding('Quests geopend')" class="game-btn py-2.5">
                    <span class="text-base mb-0.5">📋</span> Quests
                </button>
                <button onclick="toonMelding('Storage geopend')" class="game-btn game-btn-orange py-2.5">
                    <span class="text-base mb-0.5">📦</span> Storage
                </button>
                <button onclick="toonMelding('Shop & Build')" class="game-btn game-btn-red py-2.5">
                    <span class="text-base mb-0.5">🏗️</span> Shop
                </button>
                <!-- Rechtsomgeving: Inventory, Animals -->
                <button onclick="toonMelding('Inventory geopend')" class="game-btn game-btn-orange py-2.5">
                    <span class="text-base mb-0.5">🎒</span> Invent.
                </button>
                <button onclick="toonMelding('Animals geopend')" class="game-btn py-2.5">
                    <span class="text-base mb-0.5">🦁</span> Animals
                </button>
            </div>
        </div>

    </div>

    <!-- Melding Popup / Toast -->
    <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/90 border-2 border-amber-400 text-amber-300 px-6 py-3 rounded-2xl text-sm font-bold shadow-2xl z-50 hidden text-center">
        Melding
    </div>

    <script>
        function toonMelding(tekst) {
            let toast = document.getElementById('toast');
            toast.innerText = tekst;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2000);
        }
    </script>

</body>
</html>
